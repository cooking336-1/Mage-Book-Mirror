[project]
name = "magebooks-backend"
version = "0.1.0"
description = "Mage Books SAAS - Ghana Enterprise Accounting Platform Backend"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15",
    "django-environ>=0.11",
    "uuid6>=2024.7",
    "psycopg[binary]>=3.2",
    "django-cors-headers>=4.4",
    "django-storages[s3]>=1.14",
    "boto3>=1.35",
    "djangorestframework-simplejwt>=5.5.1",
    "reportlab>=5.0.1",
    "redis>=8.1.0",
    "celery>=5.6.3",
    "httpx>=0.28.1",
    "cryptography>=50.0.1",
    "pyjwt>=2.15.0",
    "gunicorn>=26.2.0",
    "whitenoise[brotli]>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "bandit>=1.8.0",
    "pip-audit>=2.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["E501"]

